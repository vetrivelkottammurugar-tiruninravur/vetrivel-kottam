<style>

.pg{display:flex;gap:8px;overflow-x:auto;margin:6px 0}.pg img{height:72px;border-radius:8px;border:1px solid var(--bd)}

.hero{text-align:center;padding:10px 4px 6px}.hero h1{font-size:19px;line-height:1.35;margin:10px 0 2px;color:var(--pri)}.hero p{margin:0;color:var(--mut);font-size:14px}
.chips.lang{justify-content:center;flex-wrap:wrap;overflow:visible}

 #modal.bottom .mb{top:auto;bottom:5vh;border-radius:18px}

}

}

<script>
'use strict';
/* =====================  helpers  ===================== */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const z2=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+z2(d.getMonth()+1)+'-'+z2(d.getDate());
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x;};
const ddmmOf=d=>z2(d.getDate())+z2(d.getMonth()+1);
const fd=s=>s?s.split('-').reverse().join('-'):'';
const fk=k=>k?k.slice(0,2)+'-'+k.slice(2):'';
const money=n=>'₹'+(Number(n)||0).toLocaleString('en-IN');
function normDDMM(v){v=String(v||'').replace(/\D/g,'');if(!v)return'';if(v.length!==4)return null;const d=+v.slice(0,2),m=+v.slice(2);if(m<1||m>12||d<1)return null;return d>[31,29,31,30,31,30,31,31,30,31,30,31][m-1]?null:v;}
function daysUntil(k){const n=new Date();let d=new Date(n.getFullYear(),+k.slice(2)-1,+k.slice(0,2));const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());if(d<t)d=new Date(n.getFullYear()+1,d.getMonth(),d.getDate());return Math.round((d-t)/864e5);}
const enc=new TextEncoder(),dec=new TextDecoder();
function b64(u8){let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode.apply(null,u8.subarray(i,i+8192));return btoa(s);}
const ub64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){const km=await crypto.subtle.importKey('raw',enc.encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:200000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function hashPw(pw,saltB64){const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return b64(new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:ub64(saltB64),iterations:150000,hash:'SHA-256'},km,256)));}
const newSalt=()=>b64(crypto.getRandomValues(new Uint8Array(16)));

const kvOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('tmgr',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function kvSet(k,v){try{const d=await kvOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function kvGet(k){try{const d=await kvOpen();return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function parseFile(text,pass){
 let o;try{o=JSON.parse(text);}catch(e){throw new Error('This is not a valid database file.');}
 let crypt=null;
 if(o&&o.enc){
  if(!pass)throw new Error('This database is encrypted. Enter the database passphrase.');
  const salt=ub64(o.salt),key=await deriveKey(pass,salt);let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.data));}catch(e){throw new Error('Wrong passphrase.');}
  o=JSON.parse(dec.decode(pt));crypt={salt,key};
 }
 if(!o||!o.meta||o.meta.app!=='MurugarTempleManager'||!o.users)throw new Error('This file is not a Murugar Temple Manager database.');
 return{db:migrate(o),crypt};}
async function adopt(text,pass,handle){const r=await parseFile(text,pass);db=r.db;S.crypt=r.crypt;S.pass=pass||'';S.baseRev=db.meta.rev;S.handle=handle||null;S.user=null;S.status=handle?'saved':'local';cacheText(text);}
async function serialize(){
 const json=JSON.stringify(db);
 if(!S.crypt)return json;
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},S.crypt.key,enc.encode(json)));
 return JSON.stringify({enc:1,v:1,salt:b64(S.crypt.salt),iv:b64(iv),data:b64(ct)});}
function cacheText(t){try{localStorage.setItem('tmgr_cache',t);}catch(e){}}
async function persist(){
 if(S.saving){S.again=true;return;}
 S.saving=true;
 try{
  if(S.handle&&!S.force){
   const txt=await(await S.handle.getFile()).text();
   if(txt.trim()){let bad=false;try{const r=await parseFile(txt,S.pass);if(r.db.meta.rev!==S.baseRev)bad=true;}catch(e){bad=true;}
    if(bad){S.status='conflict';return;}}
  }
  S.force=false;
  db.meta.rev=S.baseRev+1;
  const text=await serialize();
  if(S.handle){const w=await S.handle.createWritable();await w.write(text);await w.close();}
  S.baseRev=db.meta.rev;S.dirty=false;cacheText(text);S.status=S.handle?'saved':'local';
 }catch(e){S.status='error';S.err=e.message;}
 finally{S.saving=false;updStatus();if(S.again){S.again=false;persist();}}}
function touch(action,detail){
 db.meta.updated=new Date().toISOString();
 if(action){db.audit.push({t:db.meta.updated,u:S.user?S.user.username:'-',a:action,d:detail||''});if(db.audit.length>600)db.audit.splice(0,db.audit.length-600);}
 S.dirty=true;S.status='saving';updStatus();clearTimeout(S.tmr);S.tmr=setTimeout(persist,500);}
function updStatus(){const e=$('#stat');if(!e)return;const m={saved:'● Saved to file',local:'● Local copy only',saving:'● Saving…',conflict:'⚠ File changed elsewhere',error:'⚠ Save failed',none:''};e.className='stat '+S.status;e.textContent=m[S.status]||'';
 const w=$('#warn');if(w)w.innerHTML=warnHtml();}
function warnHtml(){
 if(S.status==='conflict')return`<div class="warn">The database file was changed by another device (OneDrive) after you opened it. <button class="btn sm" data-act="reloadFile">Reload from file (lose my unsaved changes)</button> <button class="btn sm bad" data-act="overwrite">Overwrite file with my version</button></div>`;
 if(S.status==='error')return`<div class="warn">Could not save: ${esc(S.err)}. Use <b>Save a copy</b> in Backup to keep your data.</div>`;
 if(!S.handle&&S.user)return`<div class="warn">Not linked to a file in OneDrive. Changes are kept on this device only — use <b>Backup → Save a copy</b> (then save into OneDrive) after editing.</div>`;
 return'';}

async function bindStart(){
 $('#bOpen').onclick=async()=>{
  sErr('');
  try{
   if(fsOK()){const[h]=await showOpenFilePicker({types:[{description:'Temple database',accept:{'application/json':['.json']}}]});
    await h.requestPermission({mode:'readwrite'});const text=await(await h.getFile()).text();await adopt(text,$('#pp').value,h);kvSet('handle',h);}
   else{const inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
    inp.onchange=async()=>{try{if(!inp.files[0])return;const text=await inp.files[0].text();await adopt(text,$('#pp').value,null);render();}catch(e){sErr(e.message);}};inp.click();return;}
   render();
  }catch(e){if(e.name!=='AbortError')sErr(e.message);}};
 const c=$('#bCache');if(c)c.onclick=async()=>{try{await adopt(store.get('tmgr_cache'),$('#pp').value,null);render();}catch(e){sErr(e.message);}};
 const h=fsOK()?await kvGet('handle'):null;
 if(h){$('#reopenWrap').style.display='block';$('#bReopen').textContent='↻ Reopen: '+h.name;
  $('#bReopen').onclick=async()=>{try{if((await h.requestPermission({mode:'readwrite'}))!=='granted')throw new Error('Permission denied');const text=await(await h.getFile()).text();await adopt(text,$('#pp').value,h);render();}catch(e){sErr(e.message);}};}
 $('#bNew').onclick=async()=>{
  try{
   if(!crypto.subtle)throw new Error('Secure context required (see warning above).');
   const t=$('#nt').value.trim(),n=$('#na').value.trim(),u=$('#nu').value.trim(),p=$('#np').value;
   if(!t||!n||!u)throw new Error('Temple name, admin name and username are required.');
   if(p.length<8)throw new Error('Password must be at least 8 characters.');if(p!==$('#np2').value)throw new Error('Passwords do not match.');
   let h=null;if(window.__useCloud&&window.__useCloud()){h=graphHandle();}else if(fsOK()){try{h=await showSaveFilePicker({suggestedName:'murugar_temple_db.json',types:[{description:'Temple database',accept:{'application/json':['.json']}}]});}catch(e){if(e.name!=='AbortError')throw e;}}
   db=await newDb(t,n,u,p);S.user=null;S.handle=h;S.baseRev=0;S.crypt=null;S.pass='';
   const pe=$('#ne').value;if(pe){S.pass=pe;const salt=crypto.getRandomValues(new Uint8Array(16));S.crypt={salt,key:await deriveKey(pe,salt)};}
   if(h)kvSet('handle',h);S.status='saving';await persist();render();toast('Database created. Please log in.');
  }catch(e){sErr(e.message);}};}

const CSVCOLS=['name','mobile','whatsapp','address','dob','marital','mdate','gotra','kula','nakshatra','pada','rasi','lang','notes'];
function toCSV(rows,cols){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return'\ufeff'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');}
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){r.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[];}else f+=c;}if(f!==''||r.length){r.push(f);rows.push(r);}return rows.filter(x=>x.some(y=>y.trim()));}

 if(fd0.get('p')!==fd0.get('p2'))throw new Error('Passphrases do not match');const salt=crypto.getRandomValues(new Uint8Array(16));S.pass=fd0.get('p');S.crypt={salt,key:await deriveKey(S.pass,salt)};touch('encryption on');render();toast('Encryption on');});

async function importCsv(file){
 const rows=parseCSV(await file.text());if(rows.length<2)return toast('No data rows found');
 const h=rows[0].map(x=>x.trim().toLowerCase());if(!h.includes('name')||!h.includes('mobile'))return toast('CSV needs "name" and "mobile" columns');
 let add=0,skip=0,bad=0;const have=new Set(db.devotees.map(d=>d.mobile.replace(/\D/g,'')));
 rows.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());if(!o.name||!o.mobile){bad++;return;}
  const key=o.mobile.replace(/\D/g,'');if(have.has(key)){skip++;return;}
  const dob=normDDMM(o.dob),md=normDDMM(o.mdate);if(dob===null||md===null){bad++;return;}
  const rasi=RASI.find(x=>x.toLowerCase().startsWith((o.rasi||'#').toLowerCase().split(' ')[0]))||'';
  const nak=NAK.find(x=>x.toLowerCase().startsWith((o.nakshatra||'#').toLowerCase().split(' ')[0]))||'';
  db.devotees.push({id:uid(),name:o.name,mobile:o.mobile,whatsapp:o.whatsapp||'',address:o.address||'',dob,byear:'',marital:MARITAL.find(m=>m.toLowerCase()===(o.marital||'').toLowerCase())||'',mdate:md,gotra:o.gotra||'',lang:LANGS.some(l=>l[0]===o.lang)?o.lang:'',kula:o.kula||'',nakshatra:nak,pada:o.pada||'',rasi:rasi||rasiFor(nak,o.pada),family:[],notes:o.notes||'',alerts:true,created:new Date().toISOString(),updated:new Date().toISOString()});have.add(key);add++;});
 touch('csv import',add+' added');render();toast(`Imported ${add}, skipped ${skip} duplicate, ${bad} invalid`);}

function mapFor(list){if(MAPS[list])return MAPS[list];const m=new Map();(list==='gotra'?GOTRA_ITEMS:list==='nak'?NAK_ITEMS:RASI_ITEMS).forEach(it=>m.set(it.v,it));return MAPS[list]=m;}
const shortEn=v=>String(v).split(' (')[0];
function itemLabel(it,code){const l=LI[code||S.lang]||0;if(!l)return it.v;const loc=it.L[l];return loc?loc+' · '+shortEn(it.v):it.v;}
function lab(list,v,code){if(!v)return'';const it=mapFor(list).get(v);return it?itemLabel(it,code):v;}
function nameIn(list,v,code){const it=mapFor(list).get(v);const l=LI[code]||0;return it?(it.L[l]||it.v):(v||'');}
function nm(list,v){const it=mapFor(list).get(v);return it?it.L.join(' ')+' '+it.A.replace(/\|/g,' '):(v||'');}
const rasiLabel=r=>lab('rasi',r);
const nakLabel=n=>lab('nak',n);
function itemsFor(list){
 if(list==='nak')return NAK_ITEMS;if(list==='rasi')return RASI_ITEMS;
 const base=GOTRA_ITEMS.slice(),have=new Set(base.map(b=>b.v.toLowerCase()));
 [...((db&&db.settings.customGotra)||[]),...((db&&db.devotees)||[]).map(d=>d.gotra)].filter(Boolean).forEach(x=>{if(!have.has(x.toLowerCase())){have.add(x.toLowerCase());base.push({v:x,L:[x],A:'',custom:1});}});
 return base;}
function rememberGotra(g){if(!g||mapFor('gotra').has(g))return;const c=db.settings.customGotra=db.settings.customGotra||[];if(!c.some(x=>x.toLowerCase()===g.toLowerCase()))c.push(g);}

/* ---------- phonetic-tolerant search (English spellings, Tamil/Hindi/Telugu/Kannada/Malayalam script) ---------- */
function norm(s){
 return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\p{L}\p{N}\p{M}]/gu,'').replace(/(.)\1+/g,'$1')
  .replace(/ow|ou/g,'au').replace(/sh|ś|ṣ/g,'s').replace(/th/g,'t').replace(/dh/g,'d').replace(/bh/g,'b').replace(/kh/g,'k').replace(/gh/g,'g').replace(/ch/g,'c').replace(/ph/g,'p')
  .replace(/w/g,'v').replace(/z/g,'s').replace(/y/g,'i').replace(/d/g,'t').replace(/g/g,'k').replace(/b/g,'p');}
function cbSearch(list,q){
 const items=itemsFor(list),nq=norm(q);if(!nq)return items.slice(0,80);
 const sc=[];
 items.forEach(it=>{let best=9;it.L.concat((it.A||'').split('|')).forEach(k=>{if(!k)return;const n=norm(k),i=n.indexOf(nq);if(i===0)best=Math.min(best,0);else if(i>0)best=Math.min(best,1);});if(best<9)sc.push([best,it]);});
 sc.sort((a,b)=>a[0]-b[0]);return sc.map(x=>x[1]).slice(0,80);}

/* ---------- searchable pick-list (combo box) ---------- */
function combo(name,list,val,custom,ph){
 return`<div class="cb" data-list="${list}" data-custom="${custom?1:0}"><input type="text" class="cbi" autocomplete="off" placeholder="${esc(ph||'Type to search…')}" value="${esc(lab(list,val))}"><input type="hidden" name="${name}" value="${esc(val||'')}"><button type="button" class="cbx" tabindex="-1" aria-label="open">▾</button><div class="cbl"></div></div>`;}
function setCombo(hid,v){hid.value=v||'';const cb=hid.closest('.cb');if(cb)$('.cbi',cb).value=lab(cb.dataset.list,v);}
function cbHide(cb){const l=$('.cbl',cb);l.classList.remove('on');l.innerHTML='';}
function cbShow(cb,q){
 const list=cb.dataset.list,custom=cb.dataset.custom==='1',l=$('.cbl',cb),cur=$('input[type=hidden]',cb).value;
 const res=cbSearch(list,q),code=LI[S.lang]||0;
 let h=res.map(it=>`<div class="cbo${it.v===cur?' sel':''}" data-v="${esc(it.v)}"><b>${esc(it.L[code]||it.v)}</b> <small>${esc(code?shortEn(it.v):(it.L[1]||''))}</small></div>`).join('');
 const t=(q||'').trim();
 if(custom&&t&&!res.some(it=>itemLabel(it)===t||it.v.toLowerCase()===t.toLowerCase()))h+=`<div class="cbo" data-v="${esc(t)}">＋ ${esc(L('Add as new'))}: <b>${esc(t)}</b></div>`;
 if(!h)h=`<div class="mut" style="padding:8px">${esc(L('No match'))}</div>`;
 l.innerHTML=h;l.classList.add('on');const f=$('.cbo',l);if(f&&t)f.classList.add('act');}
function cbPick(cb,v){
 const hid=$('input[type=hidden]',cb),inp=$('.cbi',cb);
 const ch=hid.value!==v;hid.value=v;inp.value=lab(cb.dataset.list,v);cbHide(cb);
 if(ch)hid.dispatchEvent(new Event('change',{bubbles:true}));}
function cbCommit(cb){
 const inp=$('.cbi',cb),hid=$('input[type=hidden]',cb),list=cb.dataset.list,custom=cb.dataset.custom==='1',txt=inp.value.trim();
 const fire=v=>{if(hid.value!==v){hid.value=v;hid.dispatchEvent(new Event('change',{bubbles:true}));}};
 if(!txt){fire('');return;}
 const items=itemsFor(list),nq=norm(txt);
 let hit=items.find(it=>itemLabel(it)===txt)||items.find(it=>it.L.concat((it.A||'').split('|')).some(k=>k&&norm(k)===nq));
 if(!hit&&!custom){const r=cbSearch(list,txt);if(r.length===1)hit=r[0];}
 if(hit){fire(hit.v);inp.value=itemLabel(hit);return;}
 if(custom){fire(txt);return;}
 inp.value=lab(list,hid.value);}
document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i){i.select();cbShow(i.closest('.cb'),'');}});
document.addEventListener('input',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i)cbShow(i.closest('.cb'),i.value);});
document.addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i){const cb=i.closest('.cb');cbCommit(cb);cbHide(cb);}});
document.addEventListener('mousedown',e=>{const o=e.target.closest&&e.target.closest('.cbo');if(o){e.preventDefault();cbPick(o.closest('.cb'),o.dataset.v);}});
document.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('.cbx');if(x)$('.cbi',x.closest('.cb')).focus();});
document.addEventListener('keydown',e=>{
 const i=e.target.closest&&e.target.closest('.cbi');if(!i)return;const cb=i.closest('.cb'),l=$('.cbl',cb);
 const os=[...l.querySelectorAll('.cbo')],ai=os.findIndex(o=>o.classList.contains('act'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!l.classList.contains('on'))cbShow(cb,i.value);const os2=[...l.querySelectorAll('.cbo')];if(!os2.length)return;const n=e.key==='ArrowDown'?Math.min(os2.length-1,ai+1):Math.max(0,ai-1);os2.forEach(o=>o.classList.remove('act'));os2[n].classList.add('act');os2[n].scrollIntoView({block:'nearest'});}
 else if(e.key==='Enter'){e.preventDefault();const a=l.querySelector('.cbo.act')||(os.length===1?os[0]:null);if(a)cbPick(cb,a.dataset.v);else{cbCommit(cb);cbHide(cb);}}
 else if(e.key==='Escape'){cbHide(cb);}});

async function ocrTess(cv,lang,prog,cancel){

 await loadTess();const mk=async l=>{const w=await Tesseract.createWorker(l,1,{logger:()=>{}});await w.setParameters({tessedit_pageseg_mode:'7',preserve_interword_spaces:'1'});return w;};
 const dual=/eng/.test(lang)&&lang.includes('+');let wm=null,we=null;
 try{wm=await mk(lang);if(dual)we=await mk('eng');
  const text=[],crops=[];
  for(let i=0;i<pre.lines.length;i++){if(cancel&&cancel())break;prog('Reading line '+(i+1)+' of '+pre.lines.length,i/pre.lines.length);
   const cvn=pre.lines[i].canvas,a=await wm.recognize(cvn);let best={text:lineClean(a.data.text),conf:a.data.confidence||0};
   if(we){const b=await we.recognize(cvn);best=pickBest(best,{text:lineClean(b.data.text),conf:b.data.confidence||0});}
   text.push(fixDigits(best.text));crops.push({img:scaled(cvn,560,.55),conf:Math.round(best.conf)});}
  return{text:text.join('\n'),crops,angle:pre.angle,n:pre.lines.length};
 }finally{if(wm)await wm.terminate();if(we)await we.terminate();}}

 <div class="f2" style="margin-top:6px"><div><label>${esc(L('Donation date'))} (${esc(L('if the page has none'))})</label><input type="date" data-scd="defDate" value="${esc(sc.defDate)}"></div><div><label>${esc(L('Purpose'))}</label><input data-scd="purpose" list="purl" value="${esc(sc.purpose)}" autocomplete="off"><datalist id="purl">${db.settings.purposes.map(p=>`<option value="${esc(p)}">`).join('')}</datalist></div></div>
 <div id="scProg">${scProgHtml()}</div>
 ${sc.pages.length?`<div class="pg">${sc.pages.map((u,i)=>`<img src="${u}" alt="" data-act="scPage" data-i="${i}">`).join('')}</div>`:''}
 ${sc.warn.map(w=>`<div class="warn">📷 ${esc(L('Page'))} ${w.page+1}: ${esc(L(w.kind==='blurry'?'looks blurry — hold the phone steady, tap the screen to focus, then retake.':w.kind==='dark'?'is too dark — turn on a light or move near a window, then retake.':'has low contrast — avoid glare and shadows, then retake.'))} <button type="button" class="btn sm" data-act="scCam">${esc(L('Retake'))}</button></div>`).join('')}
 ${sc.hint?`<div class="warn">${esc(L(sc.hint))} <button type="button" class="btn sm" data-act="aiSetup">${esc(L('Set up Smart Scan'))}</button></div>`:''}
 ${sc.err?`<div class="warn">${esc(sc.err)}</div>`:''}</div><div id="scRev">${scReview()}</div>`;};
const scEngine=()=>DEV.get().engine==='tess'?'tess':'ai';
const scReady=()=>{const c=aiCfg();return!!(c.key&&c.ok);};
function scProgHtml(){const sc=S.scan;if(!sc.running&&!sc.busy)return'';
 return`<div class="okbox">${sc.running?'<span class="spin"></span>':''}${esc(L(sc.busy))}${sc.running?`<div class="prog"><i style="width:${Math.round((sc.pct||0)*100)}%"></i></div><button type="button" class="btn sm" data-act="scCancel">${esc(L('Cancel'))}</button>`:''}</div>`;}
function scProg(t,p){const sc=S.scan;sc.busy=t;if(p!=null)sc.pct=p;const e=$('#scProg');if(e)e.innerHTML=scProgHtml();}
function scAddRow(row,page,def){const r={...row,id:uid(),page,inc:true,don:true,act:'new',_set:0};r.date=r.date||def;S.scan.rows.push(scRecompute(r));}
function scAddText(text,page,crops,def){
 const p=parseNotebook(text),d=p.pageDate||def||S.scan.defDate;
 p.rows.forEach(r=>{const cr=crops&&crops[r.li];if(cr){r.crop=cr.img;if(cr.conf<55)r.unclear=true;}scAddRow(r,page,d);});return p.rows.length;}
async function scRun(files){
 const sc=S.scan;if(sc.running)return;sc.running=true;sc.cancel=false;sc.err='';sc.warn=[];sc.hint='';scProg('Preparing…',0);
 try{
  const r=await readImages(files,'notebook',scProg,()=>sc.cancel),base=sc.pages.length;let n=0;
  const pd=r.pageDate&&findDates(toAscii(r.pageDate)).filter(x=>x.ok)[0],def=pd?(pd.y||new Date().getFullYear())+'-'+z2(pd.m)+'-'+z2(pd.d):sc.defDate;
  r.thumbs.forEach(t=>sc.pages.push(t));
  if(r.engine==='ai'){r.rows.forEach(row=>{scAddRow(row,row.page+base,def);n++;});}
  else{r.texts.forEach((tx,i)=>{n+=scAddText(tx,base+i,r.crops[i],def);});
   const good=sc.rows.filter(x=>x.mobile).length;if(n&&good/Math.max(1,sc.rows.length)<.4)sc.hint='On-device reading found few valid mobile numbers. For handwriting, Smart Scan is far more reliable.';}
  sc.warn=r.warns.map(w=>({...w,page:w.page+base}));
  sc.busy=sc.cancel?'Cancelled.':n?'Found '+n+' entries. Please review below.':'No entries could be read. Try a clearer photo, Smart Scan, or Paste text.';
 }catch(e){sc.err=e.message;sc.busy='';}
 finally{sc.running=false;}
 render();}
function pickFiles(multi,cam,cb){const i=document.createElement('input');i.type='file';i.accept='image/*';if(multi)i.multiple=true;if(cam)i.setAttribute('capture','environment');i.style.display='none';document.body.appendChild(i);i.onchange=()=>{const f=i.files&&[...i.files];i.remove();if(f&&f.length)cb(f);};i.click();}
A.scCam=()=>{if(scEngine()==='ai'&&!scReady())return A.aiSetup();pickFiles(false,true,scRun);};A.scPick=()=>{if(scEngine()==='ai'&&!scReady())return A.aiSetup();pickFiles(true,false,scRun);};A.scCancel=()=>{S.scan.cancel=true;scProg('Cancelling…');};
A.engine=d=>{DEV.set({engine:d.e});render();};
A.scPaste=()=>modal('Paste text',`<label>One entry per line — e.g.  Murugan 9876543210 DOB 15/07 Marriage 21/02 ₹500</label><textarea id="pt" style="min-height:190px" placeholder="Murugan  9876543210  15/07  21/02  500"></textarea><p class="mut">Tip: on Android you can select text in Google Lens / Keep / Gboard “scan text”, then paste here.</p>`,()=>{const t=$('#pt').value;if(!t.trim())throw new Error('Nothing to read.');const n=scAddText(t,-1);S.scan.err='';S.scan.busy=n?'Found '+n+' entries.':'No entries found.';render();},{ok:'Read text'});
A.scPage=d=>{const u=S.scan.pages[+d.i];if(u)modal('Page',`<div style="overflow:auto;max-height:70vh;border-radius:8px"><img src="${u}" style="width:220%;max-width:none;display:block"></div><p class="mut">Scroll to pan.</p>`,null,{noSave:true});};
A.scDel=d=>{S.scan.rows.splice(+d.i,1);scRefresh();};
A.scClear=()=>{if(confirm('Discard all scanned rows?')){S.scan.rows=[];S.scan.pages=[];S.scan.busy='';S.scan.warn=[];S.scan.hint='';render();}};
A.scAdd=()=>{S.scan.rows.push(scRecompute({raw:'',name:'',mobile:'',whatsapp:'',dob:'',mdate:'',date:S.scan.defDate,amount:null,byear:'',badMobile:'',dobBad:'',mdateBad:'',dateBad:'',id:uid(),page:-1,inc:true,don:true,act:'new',_set:0}));scRefresh();};
function scRefresh(){const e=$('#scRev');if(e)e.innerHTML=scReview();}
function scEdit(i,k,v,live){
 const r=S.scan.rows[i];if(!r)return;
 if(k==='inc'||k==='don'||k==='upd')r[k]=v;else if(k==='act'){r.act=v;r._set=1;}else if(k==='name')r.name=String(v).trim();
 else if(k==='mobile'){const c=cleanMobile(toAscii(v));if(!String(v).trim()){r.mobile='';r.badMobile='';}else if(isInMobile(c)){r.mobile=c;r.badMobile='';}else{r.mobile='';r.badMobile=String(v).trim();}}
 else if(k==='dob'||k==='mdate'){const x=ddmmIn(toAscii(v)),b=k==='dob'?'dobBad':'mdateBad';if(!String(v).trim()){r[k]='';r[b]='';}else if(x){r[k]=x;r[b]='';}else{r[k]='';r[b]=String(v).trim();}}
 else if(k==='amount'){const n=parseFloat(toAscii(v).replace(/,/g,''));r.amount=String(v).trim()===''||isNaN(n)?null:n;}
 else if(k==='date'){r.date=v;r.dateBad='';}
 r.unclear=k==='name'||k==='mobile'||k==='amount'?false:r.unclear;
 scRecompute(r);const el=$('[data-card="'+i+'"]');
 if(el){$('.flags',el).innerHTML=scFlags(r);if(k!=='act')$('.selwrap',el).innerHTML=scSel(r,i);const d=$('[data-k=don]',el);if(d)d.checked=!!r.don;el.classList.toggle('off',!r.inc);
  const fld=$('[data-k="'+k+'"]',el),show={mobile:r.mobile||r.badMobile,dob:r.dob?fk(r.dob):r.dobBad,mdate:r.mdate?fk(r.mdate):r.mdateBad,amount:r.amount==null?'':r.amount,name:r.name}[k];
  if(!live&&fld&&show!==undefined&&fld.type!=='checkbox')fld.value=show;}
 const s=$('#scSum');if(s)s.innerHTML=scSummary();}
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.sr!==undefined&&t.type!=='checkbox'&&t.tagName!=='SELECT')scEdit(+t.dataset.sr,t.dataset.k,t.value,true);});
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset)return;
 if(t.dataset.sr!==undefined)scEdit(+t.dataset.sr,t.dataset.k,t.type==='checkbox'?t.checked:t.value);
 else if(t.dataset.scd)S.scan[t.dataset.scd]=t.value;else if(t.dataset.dev)DEV.set({[t.dataset.dev]:t.value});});
const scriptOf=t=>/[\u0B80-\u0BFF]/.test(t)?'ta':/[\u0900-\u097F]/.test(t)?'hi':/[\u0C00-\u0C7F]/.test(t)?'te':/[\u0C80-\u0CFF]/.test(t)?'kn':/[\u0D00-\u0D7F]/.test(t)?'ml':'en';
function nameDiffers(v,n){const names=[v.name,...(v.aka||[])];return!names.some(x=>scriptOf(x)===scriptOf(n)&&simName(x,n)>=.6);}
function addAka(v,n){if(!n||norm(n)===norm(v.name))return false;v.aka=v.aka||[];if(v.aka.some(x=>norm(x)===norm(n)))return false;v.aka.push(n);return true;}
function updateFrom(v,r){let ch=false;if(r.dob&&v.dob!==r.dob){v.dob=r.dob;ch=true;}if(r.byear){v.byear=r.byear;}if(r.mdate&&v.mdate!==r.mdate){v.mdate=r.mdate;if(!v.marital)v.marital='Married';ch=true;}if(r.address&&v.address!==r.address){v.address=r.address;ch=true;}
 if(r.name&&norm(r.name)!==norm(v.name)){addAka(v,v.name);v.aka=(v.aka||[]).filter(x=>norm(x)!==norm(r.name));v.name=r.name;ch=true;}
 if(ch)v.updated=new Date().toISOString();return ch;}
function fillEmpty(v,r){let ch=false;const set=(k,x)=>{if(x&&!v[k]){v[k]=x;ch=true;}};
 set('mobile',r.mobile);set('whatsapp',r.whatsapp&&r.whatsapp!==cleanMobile(v.mobile)?r.whatsapp:'');set('dob',r.dob);set('byear',r.byear);set('address',r.address);
 if(r.mdate&&!v.mdate){v.mdate=r.mdate;ch=true;if(!v.marital)v.marital='Married';}
 if(r.name&&addAka(v,r.name)&&!(r.upd))ch=true;
 if(r.upd&&updateFrom(v,r))ch=true;if(ch)v.updated=new Date().toISOString();return ch;}
A.scSave=()=>{
 const sc=S.scan;let nNew=0,nLink=0,nDon=0,tot=0;const keep=[],byName=new Map();
 sc.rows.forEach(r=>{
  if(!r.inc||r.act==='skip')return;let devId=null;
  if(r.act==='new'){if(!r.name){keep.push(r);return;}
   let v=r.mobile?db.devotees.find(x=>cleanMobile(x.mobile)===r.mobile):null;if(!v&&!r.mobile)v=dev(byName.get(norm(r.name)));
   if(v){fillEmpty(v,r);nLink++;}
   else{v={id:uid(),name:r.name,mobile:r.mobile,whatsapp:r.whatsapp||'',address:r.address||'',dob:r.dob,byear:r.byear||'',marital:r.mdate?'Married':'',mdate:r.mdate,gotra:'',kula:'',nakshatra:'',pada:'',rasi:'',lang:db.settings.defLang||'ta',family:[],notes:'Added from notebook scan',alerts:true,waStatus:'',channel:'auto',src:'notebook',created:new Date().toISOString(),updated:new Date().toISOString()};db.devotees.push(v);nNew++;if(!r.mobile)byName.set(norm(r.name),v.id);}
   devId=v.id;}
  else if(r.act.startsWith('link:')){const v=dev(r.act.slice(5));if(!v){keep.push(r);return;}fillEmpty(v,r);devId=v.id;nLink++;}
  if(r.don&&r.amount>0){db.donations.push({id:uid(),devId,name:devId?'':(r.name||'Anonymous'),amount:r.amount,date:r.date||iso(new Date()),purpose:sc.purpose||'Donation',mode:'Cash',rcpt:nextRcpt(),note:r.note||'',src:'scan',by:S.user.username,created:new Date().toISOString()});nDon++;tot+=r.amount;}});
 if(!nNew&&!nLink&&!nDon){toast(keep.length?'Add a name to the highlighted rows first':'Nothing to save');return;}
 sc.rows=keep;if(!keep.length){sc.pages=[];sc.warn=[];sc.hint='';}
 touch('scan import',nNew+' new, '+nLink+' existing, '+nDon+' donations ('+tot+')');
 toast(`Saved: ${nNew} new devotees, ${nLink} existing, ${nDon} donations ${money(tot)}`);
 if(keep.length)render();else go(nDon?'donations':'devotees');};

A.aiSetup=()=>{const c=DEV.get().ai||{provider:'gemini'},sh=db.settings.aiShared,cur=c.key?c:(sh||c);
 modal('Smart Scan setup',`<p class="mut" style="margin-top:0">Reads Tamil + English handwriting from a photo using Google Gemini (or any OpenAI-compatible service) with <b>your own key</b>. The key stays on this device.</p>
 <ol style="padding-left:20px;margin:0 0 10px"><li>Open <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>, sign in with a Google account and tap <b>Create API key</b>.</li><li>Copy the key, come back here and paste it.</li></ol>
 <label>Service</label><select id="ai_prov" style="width:100%;margin-bottom:10px"><option value="gemini"${cur.provider!=='openai'?' selected':''}>Google Gemini (recommended)</option><option value="openai"${cur.provider==='openai'?' selected':''}>OpenAI-compatible</option></select>
 <div id="ai_oa" ${cur.provider==='openai'?'':'hidden'}><div class="f2" style="margin-bottom:10px"><div class="full"><label>Endpoint</label><input id="ai_url" value="${esc(cur.url||'https://api.openai.com/v1')}"></div><div class="full"><label>Model</label><input id="ai_model" value="${esc(cur.model||'gpt-4o-mini')}"></div></div></div>
 <label>API key</label><div class="bar" style="flex-wrap:nowrap;margin-bottom:10px"><input id="ai_key" type="password" style="flex:1;min-width:0" value="${esc(cur.key||'')}" autocomplete="off"><button type="button" class="btn sm" data-act="aiPaste">Paste</button></div>
 <label class="chk" style="align-items:flex-start"><input id="ai_ok" type="checkbox" ${cur.ok?'checked':''} style="margin-top:2px"> <span>I understand photos (with names and mobile numbers) are sent to this service to be read.</span></label>
 <div class="warn" style="margin-top:10px">🔒 <b>Privacy:</b> on Google's free tier, content you send may be used to improve Google's products; the paid tier does not. For private data, turn on billing for the key, or use <b>On-device</b> / <b>Paste text</b>.</div>
 ${S.crypt?`<label class="chk"><input id="ai_share" type="checkbox" ${sh?'checked':''}> Use the same key on my other devices (kept inside the encrypted database)</label>`:'<p class="mut">Turn on database encryption in Settings to share this key with your other devices.</p>'}
 <div id="ai_res" class="mut" style="margin:8px 0"></div><div class="bar"><button type="button" class="btn" data-act="aiTest">Test connection</button><button type="button" class="btn pri" data-act="aiSave">Save</button></div>`,null,{noSave:true});
 const sel=$('#ai_prov');sel.onchange=()=>{$('#ai_oa').hidden=sel.value!=='openai';};};
function aiForm(){const pv=$('#ai_prov').value,oa=pv==='openai';return{provider:pv,key:$('#ai_key').value.trim(),url:oa?($('#ai_url').value||''):'',model:oa?($('#ai_model').value||''):'',ok:$('#ai_ok').checked,resolved:''};}
A.aiPaste=async()=>{try{const t=await navigator.clipboard.readText();if(t)$('#ai_key').value=t.trim();else toast('Clipboard is empty');}catch(e){toast('Cannot read the clipboard — paste into the box manually.');}};
A.aiTest=async()=>{const c=aiForm(),e=$('#ai_res');e.innerHTML='<span class="spin"></span>Testing…';try{const m=await aiTest(c);e.innerHTML='✅ Key works · model: <b>'+esc(m)+'</b>';}catch(x){e.innerHTML='⚠️ '+esc(x.message);}};
A.aiSave=()=>{const c=aiForm();if(!c.key)return toast('Paste your API key first.');if(!c.ok)return toast('Please tick the consent box.');
 DEV.set({ai:c,engine:'ai'});const sh=$('#ai_share');if(sh){if(sh.checked)db.settings.aiShared={...c};else delete db.settings.aiShared;touch('smart scan setup');}
 closeModal();render();toast('Smart Scan is ready');};

function buildQueue(ev){
 const dm=donMap(),a=ev.aud||{seg:'all'};let list=db.devotees.filter(v=>v.alerts!==false);

const PWA_FILES={"manifest.webmanifest": "{\n  \"id\": \"./index.html\",\n  \"name\": \"Murugar Temple Manager\",\n  \"short_name\": \"Temple\",\n  \"description\": \"Devotees, donations, pooja bookings and WhatsApp / SMS alerts for Vetrivel Kottam, Thiruninravur\",\n  \"lang\": \"en\",\n  \"start_url\": \"./index.html\",\n  \"scope\": \"./\",\n  \"display\": \"standalone\",\n  \"orientation\": \"portrait\",\n  \"background_color\": \"#fbf6ee\",\n  \"theme_color\": \"#8c2410\",\n  \"categories\": [\"productivity\", \"business\"],\n  \"icons\": [\n    {\"src\": \"icon-192.png\", \"sizes\": \"192x192\", \"type\": \"image/png\", \"purpose\": \"any\"},\n    {\"src\": \"icon-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"any\"},\n    {\"src\": \"icon-maskable-512.png\", \"sizes\": \"512x512\", \"type\": \"image/png\", \"purpose\": \"maskable\"}\n  ],\n  \"shortcuts\": [\n    {\"name\": \"Scan notebook\", \"short_name\": \"Scan\", \"url\": \"./index.html?go=scan\"},\n    {\"name\": \"Add donation\", \"short_name\": \"Donation\", \"url\": \"./index.html?go=donation\"},\n    {\"name\": \"New booking\", \"short_name\": \"Booking\", \"url\": \"./index.html?go=booking\"},\n    {\"name\": \"Today's reminders\", \"short_name\": \"Reminders\", \"url\": \"./index.html?go=alerts\"}\n  ],\n  \"share_target\": {\n    \"action\": \"./share-target\",\n    \"method\": \"POST\",\n    \"enctype\": \"multipart/form-data\",\n    \"params\": {\n      \"title\": \"title\",\n      \"text\": \"text\",\n      \"url\": \"url\",\n      \"files\": [{\"name\": \"media\", \"accept\": [\"image/*\", \".jpg\", \".jpeg\", \".png\"]}]\n    }\n  }\n}\n", "sw.js": "/* Service worker for Murugar Temple Manager.\n   - lets the app open without internet (app shell only; your data is in your database file / OneDrive)\n   - caches the on-device OCR engine after first use\n   - receives photos shared from the Gallery / Camera (\"Share > Temple\") and hands them to the app\n   Bump V when you replace index.html so phones pick up the new version. */\nvar V = 'tmgr-v4', OCR = V + '-ocr', SH = 'tmgr-share';\nvar SHELL = ['./', './index.html', './manifest.webmanifest', './icon-192.png', './icon-512.png'];\nself.addEventListener('install', function (e) {\n  e.waitUntil(caches.open(V).then(function (c) {\n    return Promise.all(SHELL.map(function (u) { return c.add(u).catch(function () {}); }));\n  }).then(function () { return self.skipWaiting(); }));\n});\nself.addEventListener('activate', function (e) {\n  e.waitUntil(caches.keys().then(function (ks) {\n    return Promise.all(ks.filter(function (k) { return k.indexOf('tmgr-v') === 0 && k !== V && k !== OCR; }).map(function (k) { return caches.delete(k); }));\n  }).then(function () { return self.clients.claim(); }));\n});\nfunction shareTarget(req) {\n  return req.formData().then(function (fd) {\n    var files = fd.getAll('media').filter(function (f) { return f && f.size; });\n    var text = [fd.get('title'), fd.get('text'), fd.get('url')].filter(Boolean).join('\\n');\n    return caches.open(SH).then(function (c) {\n      return c.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return c.delete(k); })); }).then(function () {\n        return Promise.all(files.map(function (f, i) {\n          return c.put('/shared/' + i, new Response(f, { headers: { 'Content-Type': f.type || 'image/jpeg' } }));\n        }));\n      });\n    }).then(function () {\n      var url = new URL('./index.html', self.registration.scope);\n      url.searchParams.set('shared', String(files.length));\n      if (text) url.searchParams.set('text', text.slice(0, 4000));\n      return Response.redirect(url.href, 303);\n    });\n  }).catch(function () { return Response.redirect(new URL('./index.html', self.registration.scope).href, 303); });\n}\nself.addEventListener('fetch', function (e) {\n  var r = e.request, u = new URL(r.url);\n  if (r.method === 'POST' && u.origin === location.origin && /\\/share-target$/.test(u.pathname)) { e.respondWith(shareTarget(r)); return; }\n  if (r.method !== 'GET') return;\n  if (u.origin === location.origin) {\n    e.respondWith(caches.open(V).then(function (c) {\n      return c.match(r, { ignoreSearch: true }).then(function (hit) {\n        var net = fetch(r).then(function (res) { if (res.ok) c.put(r, res.clone()); return res; }).catch(function () { return hit; });\n        return hit || net;\n      });\n    }));\n  } else if (u.hostname === 'cdn.jsdelivr.net') {\n    e.respondWith(caches.open(OCR).then(function (c) {\n      return c.match(r).then(function (hit) {\n        if (hit) return hit;\n        return fetch(r).then(function (res) { if (res.ok || res.type === 'opaque') c.put(r, res.clone()); return res; });\n      });\n    }));\n  }\n});\n", "README.md": "# Murugar Temple Manager - install as an Android app\n\nArulmigu Sri Valli Devasena Sametha Prasanna Subramanya Swamy Thirukoil, Vetrivel Kottam, Thiruninravur\n\n## 1. Host the app files (once)\nOneDrive / SharePoint cannot display web pages, so put these files together in one folder on any free https static host\n(GitHub Pages, Netlify, Cloudflare Pages). **Your data is not stored there** - only the app.\n\n| File | Purpose |\n|---|---|\n| index.html | the app (put your `murugar_temple_manager.html` here, renamed to `index.html`) |\n| manifest.webmanifest, icon-*.png | name, icon, shortcuts, \"share to app\" |\n| sw.js | offline start + receives photos shared from the Gallery |\n\n## 2. Install on the phone\nOpen the https address in Chrome -> menu (3 dots) -> **Install app**. It gets its own icon and opens full screen.\nLong-press the icon for shortcuts: Scan notebook, Add donation, New booking, Today's reminders.\nIn the Gallery or Camera, open a photo -> Share -> **Temple** to scan it straight away.\nWant an .apk / .aab? Paste your https address into pwabuilder.com.\nAfter you replace index.html, change `tmgr-v4` in sw.js to `tmgr-v5` so phones update.\n\n## 3. OneDrive sync from the phone\nAndroid Chrome cannot write to a OneDrive file directly, so the app signs in to Microsoft Graph and keeps one file in\n**OneDrive > Apps > (your app name) > murugar_temple_db.json**.\n1. Microsoft Entra admin centre > App registrations > New registration (accounts: personal Microsoft accounts is simplest).\n2. Authentication > add platform **Single-page application**, Redirect URI = the exact address shown on the app's start screen.\n3. API permissions > Microsoft Graph > Delegated > **Files.ReadWrite.AppFolder** and offline_access.\n4. Copy the Application (client) ID into the app's start screen > Sign in to OneDrive. Tick \"Create the new database in OneDrive\" on the first device only.\nNotes: Microsoft limits refresh tokens for single-page apps to 24 hours, so expect a quick re-sign-in about once a day. Saves use the file's eTag, so two people editing at once get a conflict warning. Upload limit is 4 MB.\n\n## 4. Smart Scan (reads Tamil + English handwriting)\nScan > Smart Scan > Set up. Create a free key at aistudio.google.com/apikey and paste it. The key stays on that device (or inside your encrypted database if you choose).\nPrivacy: on Google's free tier, submitted content may be used to improve Google products; the paid tier does not. For private data enable billing, or use On-device / Paste text.\n"};

async function readShared(){try{const c=await caches.open('tmgr-share'),keys=await c.keys(),out=[];for(const k of keys){const r=await c.match(k);if(!r)continue;const b=await r.blob();out.push(new File([b],'shared.jpg',{type:b.type||'image/jpeg'}));await c.delete(k);}return out;}catch(e){return[];}}
async function applyDeepLink(){const d=S.deep;if(!d||!S.user)return;S.deep=null;
 if(d.shared){const files=await readShared();go('scan');if(files.length)setTimeout(()=>scRun(files),60);}

/* ---------- start-up ---------- */
async function boot(){
 try{history.replaceState({v:'dash',d:0},'');}catch(e){}
 let signedNow=false;try{signedNow=await GR.redeem();}catch(e){S.msErr=e.message;}
 parseLaunch();
 try{if(navigator.storage&&navigator.storage.persist){S.persisted=(await navigator.storage.persisted())||(await navigator.storage.persist());}}catch(e){}
 if(/^https?:$/.test(location.protocol)){const l=document.createElement('link');l.rel='manifest';l.href='manifest.webmanifest';document.head.appendChild(l);if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});}
 const rem=getRem(),cache=store.get('tmgr_cache');
 if(!db){
  try{
   if(GR.signed()&&(signedNow||rem||DEV.get().src==='cloud')){try{await openCloud(rem?rem.p:'');}catch(e){if(/OneDrive|fetch|network/i.test(e.message)&&rem&&cache){await adopt(cache,rem.p,null);toast('Offline copy opened');}else throw e;}}
   else if(rem&&cache)await adopt(cache,rem.p,null);
  }catch(e){S.startErr=e.message;}}
 render();if(S.startErr&&!db){sErr(S.startErr);S.startErr='';}}
boot();


window.addEventListener('beforeunload',e=>{if(S.dirty&&S.status!=='local'){e.preventDefault();e.returnValue='';}});
render();
</script>
