<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<meta name="theme-color" content="#8c2410">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<title>Murugar Temple Manager</title>
<style>
:root{--ff:"Segoe UI",Roboto,system-ui,"Nirmala UI","Noto Sans Tamil","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Malayalam",sans-serif;--fs:1;--is:1;--onpri:#fff;--onacc:#3b1c00;--pri-rgb:140,36,16;--soft:#fdf0d8;--soft2:#fff6e4;--soft3:#f3e9d6;--tint:#fbdcc9;--line:#f0e3cd;--bd2:#d9c7a8;--cream:#fff7ec;--pri:#8c2410;--pri2:#b4361b;--acc:#e8a317;--bg:#fbf6ee;--card:#fff;--bd:#eadfcb;--tx:#2b1d10;--mut:#7a6650;--ok:#1f8a4c;--bad:#c0392b;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--bn:64px;--ab:56px;--sh:0 1px 2px rgba(60,30,0,.08),0 2px 8px rgba(60,30,0,.06)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{overscroll-behavior-y:contain;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;font-family:var(--ff);font-size:calc(15px*var(--fs));line-height:1.5;background:var(--bg);color:var(--tx);overflow-x:hidden}
h2{margin:.2em 0 .6em;font-size:calc(20px*var(--fs))}h3{margin:.2em 0 .5em;font-size:calc(16px*var(--fs))}h4{margin:14px 0 6px;font-size:calc(13px*var(--fs));color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
a{color:var(--pri2)}button{font:inherit;color:inherit}
.ic{width:calc(24px*var(--is));height:calc(24px*var(--is));fill:currentColor;flex:none}.ic.big{width:48px;height:48px;opacity:.35}.ic.sm{width:18px;height:18px}
.mut{color:var(--mut);font-size:calc(13px*var(--fs))}.mut2{opacity:.85;font-size:calc(13px*var(--fs))}
/* ---------- shell ---------- */
.shell{min-height:100vh}
.appbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:4px;min-height:calc(var(--ab) + var(--sat));padding:var(--sat) 4px 0 10px;background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);box-shadow:0 2px 6px rgba(0,0,0,.25)}
.appbar .logo{display:flex;margin-right:6px}.appbar .ttl{flex:1;min-width:0;padding:6px 0}
.ttl b{display:block;font-size:calc(18px*var(--fs));line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.ttl small{display:block;font-size:calc(11px*var(--fs));opacity:.85;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:inherit;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib:active{background:rgba(120,120,120,.22)}.ib.dark{width:40px;height:40px;color:var(--mut)}
.stat{font-size:calc(11px*var(--fs));padding:3px 8px;border-radius:10px;background:rgba(255,255,255,.2);white-space:nowrap}
.stat.saved{background:#1f8a4c}.stat.conflict,.stat.error{background:#c0392b}.stat.local{background:#b9770e}
.page{padding:12px 12px calc(var(--bn) + var(--sab) + 96px);max-width:1100px;margin:0 auto}
.page>h2{display:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;height:calc(var(--bn) + var(--sab));padding-bottom:var(--sab);background:#fff;border-top:1px solid var(--bd);box-shadow:0 -2px 10px rgba(60,30,0,.08)}
.bnav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:calc(11px*var(--fs));color:var(--mut);padding:6px 2px;cursor:pointer;user-select:none}
.bnav .pill{display:flex;width:56px;min-height:28px;height:calc(28px*var(--is));border-radius:14px;align-items:center;justify-content:center;transition:background .15s}
.bnav button.on{color:var(--pri);font-weight:600}.bnav button.on .pill{background:var(--tint)}.bnav .lbl{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fab{position:fixed;right:16px;bottom:calc(var(--bn) + var(--sab) + 16px);z-index:35;width:58px;height:58px;border-radius:18px;border:0;background:var(--acc);color:var(--onacc);box-shadow:0 4px 14px rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center;cursor:pointer}
.fab:active{transform:scale(.95)}.rail{display:none}
body.kb .bnav,body.kb .fab,body.kb .sbar{display:none}
/* ---------- cards, lists ---------- */
.card{background:var(--card);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:var(--sh)}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stats{display:grid;gap:10px;grid-template-columns:repeat(2,1fr);margin:12px 0}
.stile{background:#fff;border-radius:14px;padding:12px;box-shadow:var(--sh);border-left:4px solid var(--acc);text-align:left;border-top:0;border-right:0;border-bottom:0;cursor:pointer;display:block;width:100%}
.stile b{display:block;font-size:calc(22px*var(--fs));line-height:1.2}.stile span{color:var(--mut);font-size:calc(12px*var(--fs))}
.kpi{background:#fff;border-radius:14px;padding:10px 12px;box-shadow:var(--sh);border-left:4px solid var(--acc)}.kpi b{font-size:calc(22px*var(--fs));display:block}.kpi span{color:var(--mut);font-size:calc(12px*var(--fs))}
.hero2{background:linear-gradient(135deg,var(--pri),var(--pri2));color:var(--onpri);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.hero2 h2{margin:2px 0 4px;font-size:calc(22px*var(--fs));display:block}.hero2 p{margin:0;opacity:.92;font-size:calc(14px*var(--fs))}
.qa-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qa{border:0;background:#fff;border-radius:14px;padding:12px 4px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;gap:6px;font-size:calc(12px*var(--fs));text-align:center;color:var(--pri);cursor:pointer;line-height:1.2}
.qa span{color:var(--tx)}.qa:active{background:var(--soft2)}
.li{display:flex;gap:12px;align-items:center;padding:10px 12px;background:#fff;border-radius:14px;margin-bottom:8px;box-shadow:var(--sh);cursor:pointer;min-height:64px}
.li:active{background:var(--soft2)}.li .lb{flex:1;min-width:0}.li .t{font-size:calc(16px*var(--fs));font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .s{font-size:calc(13px*var(--fs));color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.li .amt{font-weight:700;font-size:calc(16px*var(--fs));white-space:nowrap}
.li .chips2{display:flex;gap:4px;margin-top:3px;flex-wrap:wrap}
.av{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:calc(18px*var(--fs));color:#fff;flex:none}
.av.big{width:64px;height:64px;font-size:calc(26px*var(--fs))}.c0{background:#b4361b}.c1{background:#c98a10}.c2{background:#2e7d5b}.c3{background:#3f6fb5}.c4{background:#8a4fa0}.c5{background:#607d8b}
.dt{width:46px;flex:none;text-align:center;background:var(--soft);border-radius:12px;padding:4px 0}.dt b{display:block;font-size:calc(20px*var(--fs));line-height:1.1}.dt span{font-size:calc(11px*var(--fs));color:var(--mut);text-transform:uppercase}
.cnt{margin:2px 4px 8px;color:var(--mut);font-size:calc(13px*var(--fs))}
.empty{text-align:center;padding:30px 10px;color:var(--mut)}
.ib2{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--pri);background:var(--soft);flex:none;text-decoration:none}
.search{display:flex;align-items:center;gap:8px;background:#fff;border-radius:26px;padding:0 14px;height:48px;box-shadow:var(--sh);margin-bottom:10px}
.search .ic{color:var(--mut)}.search input{flex:1;min-width:0;border:0;outline:0;background:none;height:46px;font-size:calc(16px*var(--fs));color:var(--tx)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 14px;font-size:calc(14px*var(--fs));cursor:pointer;min-height:34px}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.tag{display:inline-block;padding:1px 9px;border-radius:10px;background:var(--soft);font-size:calc(12px*var(--fs));white-space:nowrap}
.tag.Booked{background:#fff1c9}.tag.Confirmed{background:#d9ecff}.tag.Completed{background:#d4f0dd}.tag.Cancelled{background:#f6d6d2}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--bd);background:#fff;color:var(--tx);padding:0 16px;min-height:44px;border-radius:22px;cursor:pointer;font-size:calc(15px*var(--fs));text-decoration:none;user-select:none}
.btn:active{background:var(--soft2)}.btn.pri{background:var(--pri);color:var(--onpri);border-color:var(--pri)}.btn.pri:active{background:var(--pri2)}
.btn.wa{background:#25d366;color:#fff;border-color:#25d366}.btn.done{opacity:.55}.btn.bad{color:var(--bad)}.btn.sm{min-height:36px;padding:0 12px;font-size:calc(13px*var(--fs));border-radius:18px}
.btn.block{display:flex;width:100%;margin:6px 0}.btn.text{border:0;background:none;color:var(--pri)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
input,select,textarea{font:inherit;font-size:calc(16px*var(--fs));min-height:46px;padding:8px 12px;border:1px solid var(--bd2);border-radius:12px;background:#fff;color:var(--tx);max-width:100%}
input[type=checkbox],input[type=radio]{min-height:0;width:20px;height:20px;flex:none;padding:0;accent-color:var(--pri)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pri2);outline-offset:0;border-color:transparent}
textarea{width:100%;min-height:80px}label{display:block;font-size:calc(13px*var(--fs));color:var(--mut);margin:0 0 4px}
.f2{display:grid;gap:12px;grid-template-columns:1fr}.f2 .full{grid-column:1/-1}.f2 input:not([type=checkbox]):not([type=radio]),.f2 select{width:100%}
@media(min-width:340px){.f2{grid-template-columns:repeat(2,minmax(0,1fr))}}
.chk{display:flex;gap:8px;align-items:center;font-size:calc(14px*var(--fs));color:var(--tx);margin:0}.chk input{flex:none}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:calc(14px*var(--fs))}th,td{padding:8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--soft);white-space:nowrap}
.kv th{background:none;color:var(--mut);font-weight:400;width:38%;white-space:normal}.kv td{word-break:break-word}
.warn{background:#fff3cd;border:1px solid #e8c766;padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:calc(14px*var(--fs))}.warn.slim{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px;font-size:calc(13px*var(--fs))}.warn.slim span{flex:1}
.okbox{background:#eef6ee;border:1px solid #b7dcb7;padding:10px 12px;border-radius:12px;margin-bottom:10px;font-size:calc(14px*var(--fs))}
.arow{display:flex;gap:10px;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--line);padding:10px 0;flex-wrap:wrap}.arow:last-child{border-bottom:0}
.arow .msg{font-size:calc(13px*var(--fs));color:var(--mut);max-width:620px;white-space:pre-wrap}.acts{display:flex;gap:6px;flex-wrap:wrap}
.slip{border:2px dashed var(--pri);padding:14px;border-radius:8px}.slip h3{text-align:center;color:var(--pri)}
.famrow{display:grid;gap:6px;grid-template-columns:2fr 1.2fr 1.5fr auto;margin-bottom:6px}
.sbar{position:fixed;left:0;right:0;bottom:calc(var(--bn) + var(--sab));z-index:36;display:flex;gap:10px;align-items:center;padding:8px 12px;background:#fff;border-top:1px solid var(--bd);box-shadow:0 -2px 8px rgba(0,0,0,.1)}.sbar .sum{flex:1;font-size:calc(13px*var(--fs));min-width:0}
.menu{display:flex;flex-direction:column}.mi{display:flex;align-items:center;gap:14px;border:0;background:none;padding:12px 4px;font-size:calc(16px*var(--fs));text-align:left;cursor:pointer;border-bottom:1px solid var(--soft3);width:100%;color:var(--tx);text-decoration:none}
.mi .ic{color:var(--pri)}.mi.bad,.mi.bad .ic{color:var(--bad)}.mi:active{background:var(--soft2)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{border:0;background:var(--soft);border-radius:14px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:calc(13px*var(--fs));text-align:center;cursor:pointer;color:var(--tx);line-height:1.2}.tile .ic{color:var(--pri)}
.acts4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}.act{border:0;background:var(--soft);border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:calc(12px*var(--fs));text-decoration:none;color:var(--tx);cursor:pointer}
.act .ic{color:var(--pri)}.act.wa{background:#dcf8e6}.act.wa .ic{color:#1da851}
.prof{display:flex;gap:14px;align-items:center;margin-bottom:6px}.prof .t{font-size:calc(18px*var(--fs));font-weight:700}
.sc{border:1px solid var(--bd);border-radius:14px;padding:10px;margin-bottom:10px;background:#fffdf8}.sc.off{opacity:.5}.sc .raw{font-size:calc(12px*var(--fs));margin-top:4px;word-break:break-word}.sc .crop{display:block;max-width:100%;max-height:70px;border-radius:6px;border:1px solid var(--bd);margin:4px 0 8px;background:#fff}
.prog{height:8px;border-radius:4px;background:var(--bd);overflow:hidden;margin:8px 0}.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}
.seg{display:flex;background:var(--soft3);border-radius:22px;padding:3px;margin-bottom:10px}.seg button{flex:1;border:0;background:none;border-radius:20px;min-height:38px;font-size:calc(14px*var(--fs));cursor:pointer}.seg button.on{background:#fff;box-shadow:var(--sh);color:var(--pri);font-weight:600}
.camera{display:flex;flex-direction:column;align-items:center;gap:6px;width:100%;border:2px dashed var(--pri2);background:var(--cream);border-radius:18px;padding:22px 10px;color:var(--pri);font-size:calc(17px*var(--fs));font-weight:600;cursor:pointer;margin-bottom:10px}.camera .ic{width:44px;height:44px}
.spin{display:inline-block;width:16px;height:16px;border:3px solid var(--bd);border-top-color:var(--pri);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px;margin-right:6px}@keyframes sp{to{transform:rotate(360deg)}}
.pg{display:flex;gap:8px;overflow-x:auto;margin:6px 0}.pg img{height:72px;border-radius:8px;border:1px solid var(--bd)}
.toast{position:fixed;bottom:calc(var(--bn) + var(--sab) + 12px);left:50%;transform:translateX(-50%);background:#2b1d10;color:#fff;padding:11px 18px;border-radius:24px;z-index:300;font-size:calc(14px*var(--fs));max-width:90vw;text-align:center;box-shadow:0 4px 14px rgba(0,0,0,.35)}
/* ---------- modal / sheets ---------- */
#modal{display:none;position:fixed;inset:0;z-index:100}#modal.on{display:block}
#modal .scrim{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#modal .mb{position:absolute;inset:0;background:#fff;display:flex;flex-direction:column;animation:up .2s ease-out}
.mh{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:calc(6px + var(--sat)) 6px 6px 16px;border-bottom:1px solid var(--bd);font-size:calc(18px*var(--fs));flex:none}.mh b{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mf{display:flex;flex-direction:column;flex:1;min-height:0}.mbody{flex:1;overflow:auto;padding:14px 16px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.mfoot{display:flex;gap:10px;padding:10px 16px calc(10px + var(--sab));border-top:1px solid var(--bd);background:#fff;flex:none}.mfoot .btn{flex:1}
#modal.bottom .mb{top:auto;max-height:86vh;border-radius:22px 22px 0 0}#modal.bottom .mh{padding-top:6px}
#modal.bottom.ro .mfoot{display:none}#modal.bottom .mbody{padding-bottom:calc(14px + var(--sab))}
@keyframes up{from{transform:translateY(36px);opacity:.4}to{transform:none;opacity:1}}
/* ---------- combo ---------- */
.cb{position:relative}.cb .cbi{width:100%;padding-right:34px}.cb .cbx{position:absolute;right:2px;top:3px;border:0;background:none;cursor:pointer;padding:10px;color:var(--mut)}
.cbl{display:none;position:absolute;left:0;right:0;top:100%;z-index:60;background:#fff;border:1px solid var(--bd2);border-radius:12px;max-height:42vh;overflow:auto;box-shadow:0 6px 16px rgba(0,0,0,.22)}.cbl.on{display:block}
.cbo{padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--line)}.cbo.act,.cbo:hover{background:var(--soft)}.cbo.sel{border-left:4px solid var(--acc)}.cbo small{color:var(--mut)}
/* ---------- start / login ---------- */
.start{max-width:520px;margin:0 auto;padding:calc(18px + var(--sat)) 14px calc(24px + var(--sab))}
.hero{text-align:center;padding:10px 4px 6px}.hero h1{font-size:calc(19px*var(--fs));line-height:1.35;margin:10px 0 2px;color:var(--pri)}.hero p{margin:0;color:var(--mut);font-size:calc(14px*var(--fs))}
.chips.lang{justify-content:center;flex-wrap:wrap;overflow:visible}
details.card>summary{cursor:pointer;font-weight:600;min-height:32px;list-style:none;display:flex;align-items:center;gap:8px}details.card>summary::-webkit-details-marker{display:none}details.card>summary::after{content:"▾";margin-left:auto;color:var(--mut)}
@media(print){body *{visibility:hidden}.slip,.slip *{visibility:visible}.slip{position:absolute;left:0;top:0;width:100%}.no-print{display:none!important}}
/* ---------- tables become cards on phones ---------- */
@media(max-width:700px){
 .rt,.rt tbody,.rt tr,.rt td{display:block}.rt tr:first-child{display:none}
 .rt tr{background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:8px;box-shadow:var(--sh)}
 .rt td{border:0;padding:3px 0;display:flex;gap:10px;justify-content:space-between;text-align:right;word-break:break-word}
 .rt td::before{content:attr(data-label);color:var(--mut);font-size:calc(12px*var(--fs));text-align:left;flex:none;max-width:40%}
 .rt td:not([data-label]){justify-content:flex-start;flex-wrap:wrap;padding-top:6px}.rt td:empty{display:none}
 .famrow{grid-template-columns:1fr 1fr}
 .page .bar>[data-act=svcAdd]{display:none}
}
/* ---------- tablet / desktop ---------- */
@media(min-width:700px){
 #modal .mb{inset:auto;left:50%;top:5vh;transform:translateX(-50%);width:720px;max-width:96vw;max-height:90vh;border-radius:18px;animation:none}
 #modal.bottom .mb{top:auto;bottom:5vh;border-radius:18px}
 .qa-grid{max-width:560px}.stats{grid-template-columns:repeat(3,1fr)}
}
@media(min-width:900px){
 .shell{display:grid;grid-template-columns:230px minmax(0,1fr);grid-template-rows:auto 1fr}
 .appbar{grid-column:1/3}.rail{display:flex;flex-direction:column;gap:2px;padding:12px 8px;position:sticky;top:calc(var(--ab) + var(--sat));align-self:start;height:calc(100vh - var(--ab))}
 .rail button{display:flex;align-items:center;gap:14px;border:0;background:none;padding:11px 14px;border-radius:24px;font-size:calc(15px*var(--fs));color:var(--tx);cursor:pointer;text-align:left}.rail button .ic{color:var(--mut)}
 .rail button.on{background:var(--tint);color:var(--pri);font-weight:600}.rail button.on .ic{color:var(--pri)}.rail button:hover{background:var(--soft3)}
 .bnav{display:none}.fab{bottom:28px;right:28px}.page{padding-bottom:110px;width:100%}.sbar{bottom:0;left:230px}.toast{bottom:28px}.stats{grid-template-columns:repeat(4,1fr)}
}

.stat.saved,.stat.conflict,.stat.error,.stat.local{color:#fff}
body.fx-read{letter-spacing:.02em;word-spacing:.04em}
.swrow{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 14px}.swb{width:48px;height:48px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--bd2);cursor:pointer;padding:0}.swb.on{box-shadow:0 0 0 3px var(--pri)}

function migrate(o){o.settings=o.settings||{};const st=o.settings,bt=JSON.parse(JSON.stringify(TPLS));if(st.tpl){Object.assign(bt.en,st.tpl);delete st.tpl;}st.tplL=st.tplL||{};LANGS.forEach(l=>{st.tplL[l[0]]={...bt[l[0]],...(st.tplL[l[0]]||{})};});st.defLang=st.defLang||'en';st.customGotra=st.customGotra||[];st.cc=st.cc||'91';['devotees','services','bookings','alerts','audit'].forEach(k=>o[k]=o[k]||[]);return o;}

/* =====================  file / storage layer  ===================== */
const kvOpen=()=>new Promise((res,rej)=>{const r=indexedDB.open('tmgr',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
async function kvSet(k,v){try{const d=await kvOpen();return await new Promise((res,rej)=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error);});}catch(e){}}
async function kvGet(k){try{const d=await kvOpen();return await new Promise((res,rej)=>{const r=d.transaction('kv').objectStore('kv').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}catch(e){return null;}}
async function parseFile(text,pass){
 let o;try{o=JSON.parse(text);}catch(e){throw new Error('This is not a valid database file.');}
 let crypt=null;
 if(o&&o.enc){
  if(!pass)throw new Error('This database is encrypted. Enter the database passphrase.');
  const salt=ub64(o.salt),key=await deriveKey(pass,salt);let pt;
  try{pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:ub64(o.iv)},key,ub64(o.data));}catch(e){throw new Error('Wrong passphrase.');}
  o=JSON.parse(dec.decode(pt));crypt={salt,key};
 }
 if(!o||!o.meta||o.meta.app!=='MurugarTempleManager'||!o.users)throw new Error('This file is not a Murugar Temple Manager database.');
 return{db:migrate(o),crypt};}
async function adopt(text,pass,handle){const r=await parseFile(text,pass);db=r.db;S.crypt=r.crypt;S.pass=pass||'';S.baseRev=db.meta.rev;S.handle=handle||null;S.user=null;S.status=handle?'saved':'local';cacheText(text);S.base=JSON.stringify(db);S.lastSync=Date.now();}
async function serialize(){
 const json=JSON.stringify(db);S.lastJson=json;
 if(!S.crypt)return json;
 const iv=crypto.getRandomValues(new Uint8Array(12));
 const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},S.crypt.key,enc.encode(json)));
 return JSON.stringify({enc:1,v:1,salt:b64(S.crypt.salt),iv:b64(iv),data:b64(ct)});}
function cacheText(t){try{localStorage.setItem('tmgr_cache',t);}catch(e){}}
async function persist(){
 if(S.saving){S.again=true;return;}
 S.saving=true;
 try{
  if(S.handle&&!S.force){
   const txt=await(await S.handle.getFile()).text();
   if(txt.trim()){let bad=false;try{const r=await parseFile(txt,S.pass);if(r.db.meta.rev!==S.baseRev)bad=true;}catch(e){bad=true;}
    if(bad){S.status='conflict';return;}}
  }
  S.force=false;
  db.meta.rev=S.baseRev+1;
  const text=await serialize();
  if(S.handle){const w=await S.handle.createWritable();await w.write(text);await w.close();}
  S.baseRev=db.meta.rev;S.dirty=false;cacheText(text);S.status=S.handle?'saved':'local';
 }catch(e){S.status='error';S.err=e.message;}
 finally{S.saving=false;updStatus();if(S.again){S.again=false;persist();}}}
function touch(action,detail){
 db.meta.updated=new Date().toISOString();
 if(action){db.audit.push({t:db.meta.updated,u:S.user?S.user.username:'-',a:action,d:detail||''});if(db.audit.length>600)db.audit.splice(0,db.audit.length-600);}
 S.dirty=true;S.status='saving';updStatus();clearTimeout(S.tmr);S.tmr=setTimeout(persist,500);}
function updStatus(){const e=$('#stat');if(!e)return;const m={saved:'● Saved to file',local:'● Local copy only',saving:'● Saving…',conflict:'⚠ File changed elsewhere',error:'⚠ Save failed',none:''};e.className='stat '+S.status;e.textContent=m[S.status]||'';
 const w=$('#warn');if(w)w.innerHTML=warnHtml();}
function warnHtml(){
 if(S.status==='conflict')return`<div class="warn">The database file was changed by another device (OneDrive) after you opened it. <button class="btn sm" data-act="reloadFile">Reload from file (lose my unsaved changes)</button> <button class="btn sm bad" data-act="overwrite">Overwrite file with my version</button></div>`;
 if(S.status==='error')return`<div class="warn">Could not save: ${esc(S.err)}. Use <b>Save a copy</b> in Backup to keep your data.</div>`;
 if(!S.handle&&S.user)return`<div class="warn">Not linked to a file in OneDrive. Changes are kept on this device only — use <b>Backup → Save a copy</b> (then save into OneDrive) after editing.</div>`;
 return'';}
function download(text,name,type){const b=new Blob([text],{type:type||'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

const CSVCOLS=['name','mobile','whatsapp','address','dob','marital','mdate','gotra','kula','nakshatra','pada','rasi','lang','notes'];
function toCSV(rows,cols){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';return'\ufeff'+[cols.join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\r\n');}
function parseCSV(t){const rows=[];let r=[],f='',q=false;t=t.replace(/^\ufeff/,'');for(let i=0;i<t.length;i++){const c=t[i];if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}else if(c==='"')q=true;else if(c===','){r.push(f);f='';}else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;r.push(f);f='';rows.push(r);r=[];}else f+=c;}if(f!==''||r.length){r.push(f);rows.push(r);}return rows.filter(x=>x.some(y=>y.trim()));}

async function importCsv(file){
 const rows=parseCSV(await file.text());if(rows.length<2)return toast('No data rows found');
 const h=rows[0].map(x=>x.trim().toLowerCase());if(!h.includes('name')||!h.includes('mobile'))return toast('CSV needs "name" and "mobile" columns');
 let add=0,skip=0,bad=0;const have=new Set(db.devotees.map(d=>d.mobile.replace(/\D/g,'')));
 rows.slice(1).forEach(r=>{const o={};h.forEach((k,i)=>o[k]=(r[i]||'').trim());if(!o.name||!o.mobile){bad++;return;}
  const key=o.mobile.replace(/\D/g,'');if(have.has(key)){skip++;return;}
  const dob=normDDMM(o.dob),md=normDDMM(o.mdate);if(dob===null||md===null){bad++;return;}
  const rasi=RASI.find(x=>x.toLowerCase().startsWith((o.rasi||'#').toLowerCase().split(' ')[0]))||'';
  const nak=NAK.find(x=>x.toLowerCase().startsWith((o.nakshatra||'#').toLowerCase().split(' ')[0]))||'';
  db.devotees.push({id:uid(),name:o.name,mobile:o.mobile,whatsapp:o.whatsapp||'',address:o.address||'',dob,byear:'',marital:MARITAL.find(m=>m.toLowerCase()===(o.marital||'').toLowerCase())||'',mdate:md,gotra:o.gotra||'',lang:LANGS.some(l=>l[0]===o.lang)?o.lang:'',kula:o.kula||'',nakshatra:nak,pada:o.pada||'',rasi:rasi||rasiFor(nak,o.pada),family:[],notes:o.notes||'',alerts:true,created:new Date().toISOString(),updated:new Date().toISOString()});have.add(key);add++;});
 touch('csv import',add+' added');render();toast(`Imported ${add}, skipped ${skip} duplicate, ${bad} invalid`);}

const NAK_ITEMS=NAK.map((n,i)=>({v:n,L:[n,...NAKL.map(a=>a[i])],A:NAKA[i]}));

const MAPS={};
function mapFor(list){if(MAPS[list])return MAPS[list];const m=new Map();(list==='gotra'?GOTRA_ITEMS:list==='nak'?NAK_ITEMS:RASI_ITEMS).forEach(it=>m.set(it.v,it));return MAPS[list]=m;}
const shortEn=v=>String(v).split(' (')[0];
function itemLabel(it,code){const l=LI[code||S.lang]||0;if(!l)return it.v;const loc=it.L[l];return loc?loc+' · '+shortEn(it.v):it.v;}
function lab(list,v,code){if(!v)return'';const it=mapFor(list).get(v);return it?itemLabel(it,code):v;}
function nameIn(list,v,code){const it=mapFor(list).get(v);const l=LI[code]||0;return it?(it.L[l]||it.v):(v||'');}
function nm(list,v){const it=mapFor(list).get(v);return it?it.L.join(' ')+' '+it.A.replace(/\|/g,' '):(v||'');}
const rasiLabel=r=>lab('rasi',r);
const nakLabel=n=>lab('nak',n);
function itemsFor(list){
 if(list==='nak')return NAK_ITEMS;if(list==='rasi')return RASI_ITEMS;
 const base=GOTRA_ITEMS.slice(),have=new Set(base.map(b=>b.v.toLowerCase()));
 [...((db&&db.settings.customGotra)||[]),...((db&&db.devotees)||[]).map(d=>d.gotra)].filter(Boolean).forEach(x=>{if(!have.has(x.toLowerCase())){have.add(x.toLowerCase());base.push({v:x,L:[x],A:'',custom:1});}});
 return base;}
function rememberGotra(g){if(!g||mapFor('gotra').has(g))return;const c=db.settings.customGotra=db.settings.customGotra||[];if(!c.some(x=>x.toLowerCase()===g.toLowerCase()))c.push(g);}

/* ---------- phonetic-tolerant search (English spellings, Tamil/Hindi/Telugu/Kannada/Malayalam script) ---------- */
function norm(s){
 return String(s).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
  .replace(/[^\p{L}\p{N}\p{M}]/gu,'').replace(/(.)\1+/g,'$1')
  .replace(/ow|ou/g,'au').replace(/sh|ś|ṣ/g,'s').replace(/th/g,'t').replace(/dh/g,'d').replace(/bh/g,'b').replace(/kh/g,'k').replace(/gh/g,'g').replace(/ch/g,'c').replace(/ph/g,'p')
  .replace(/w/g,'v').replace(/z/g,'s').replace(/y/g,'i').replace(/d/g,'t').replace(/g/g,'k').replace(/b/g,'p');}
function cbSearch(list,q){
 const items=itemsFor(list),nq=norm(q);if(!nq)return items.slice(0,80);
 const sc=[];
 items.forEach(it=>{let best=9;it.L.concat((it.A||'').split('|')).forEach(k=>{if(!k)return;const n=norm(k),i=n.indexOf(nq);if(i===0)best=Math.min(best,0);else if(i>0)best=Math.min(best,1);});if(best<9)sc.push([best,it]);});
 sc.sort((a,b)=>a[0]-b[0]);return sc.map(x=>x[1]).slice(0,80);}

/* ---------- searchable pick-list (combo box) ---------- */
function combo(name,list,val,custom,ph){
 return`<div class="cb" data-list="${list}" data-custom="${custom?1:0}"><input type="text" class="cbi" autocomplete="off" placeholder="${esc(ph||'Type to search…')}" value="${esc(lab(list,val))}"><input type="hidden" name="${name}" value="${esc(val||'')}"><button type="button" class="cbx" tabindex="-1" aria-label="open">▾</button><div class="cbl"></div></div>`;}
function setCombo(hid,v){hid.value=v||'';const cb=hid.closest('.cb');if(cb)$('.cbi',cb).value=lab(cb.dataset.list,v);}
function cbHide(cb){const l=$('.cbl',cb);l.classList.remove('on');l.innerHTML='';}
function cbShow(cb,q){
 const list=cb.dataset.list,custom=cb.dataset.custom==='1',l=$('.cbl',cb),cur=$('input[type=hidden]',cb).value;
 const res=cbSearch(list,q),code=LI[S.lang]||0;
 let h=res.map(it=>`<div class="cbo${it.v===cur?' sel':''}" data-v="${esc(it.v)}"><b>${esc(it.L[code]||it.v)}</b> <small>${esc(code?shortEn(it.v):(it.L[1]||''))}</small></div>`).join('');
 const t=(q||'').trim();
 if(custom&&t&&!res.some(it=>itemLabel(it)===t||it.v.toLowerCase()===t.toLowerCase()))h+=`<div class="cbo" data-v="${esc(t)}">＋ ${esc(L('Add as new'))}: <b>${esc(t)}</b></div>`;
 if(!h)h=`<div class="mut" style="padding:8px">${esc(L('No match'))}</div>`;
 l.innerHTML=h;l.classList.add('on');const f=$('.cbo',l);if(f&&t)f.classList.add('act');}
function cbPick(cb,v){
 const hid=$('input[type=hidden]',cb),inp=$('.cbi',cb);
 const ch=hid.value!==v;hid.value=v;inp.value=lab(cb.dataset.list,v);cbHide(cb);
 if(ch)hid.dispatchEvent(new Event('change',{bubbles:true}));}
function cbCommit(cb){
 const inp=$('.cbi',cb),hid=$('input[type=hidden]',cb),list=cb.dataset.list,custom=cb.dataset.custom==='1',txt=inp.value.trim();
 const fire=v=>{if(hid.value!==v){hid.value=v;hid.dispatchEvent(new Event('change',{bubbles:true}));}};
 if(!txt){fire('');return;}
 const items=itemsFor(list),nq=norm(txt);
 let hit=items.find(it=>itemLabel(it)===txt)||items.find(it=>it.L.concat((it.A||'').split('|')).some(k=>k&&norm(k)===nq));
 if(!hit&&!custom){const r=cbSearch(list,txt);if(r.length===1)hit=r[0];}
 if(hit){fire(hit.v);inp.value=itemLabel(hit);return;}
 if(custom){fire(txt);return;}
 inp.value=lab(list,hid.value);}
document.addEventListener('focusin',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i){i.select();cbShow(i.closest('.cb'),'');}});
document.addEventListener('input',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i)cbShow(i.closest('.cb'),i.value);});
document.addEventListener('focusout',e=>{const i=e.target.closest&&e.target.closest('.cbi');if(i){const cb=i.closest('.cb');cbCommit(cb);cbHide(cb);}});
document.addEventListener('mousedown',e=>{const o=e.target.closest&&e.target.closest('.cbo');if(o){e.preventDefault();cbPick(o.closest('.cb'),o.dataset.v);}});
document.addEventListener('click',e=>{const x=e.target.closest&&e.target.closest('.cbx');if(x)$('.cbi',x.closest('.cb')).focus();});
document.addEventListener('keydown',e=>{
 const i=e.target.closest&&e.target.closest('.cbi');if(!i)return;const cb=i.closest('.cb'),l=$('.cbl',cb);
 const os=[...l.querySelectorAll('.cbo')],ai=os.findIndex(o=>o.classList.contains('act'));
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(!l.classList.contains('on'))cbShow(cb,i.value);const os2=[...l.querySelectorAll('.cbo')];if(!os2.length)return;const n=e.key==='ArrowDown'?Math.min(os2.length-1,ai+1):Math.max(0,ai-1);os2.forEach(o=>o.classList.remove('act'));os2[n].classList.add('act');os2[n].scrollIntoView({block:'nearest'});}
 else if(e.key==='Enter'){e.preventDefault();const a=l.querySelector('.cbo.act')||(os.length===1?os[0]:null);if(a)cbPick(cb,a.dataset.v);else{cbCommit(cb);cbHide(cb);}}
 else if(e.key==='Escape'){cbHide(cb);}});

- marriage: marriage/wedding date as dd/mm or dd/mm/yyyy.

async function ocrTess(cv,lang,prog,cancel){

 if(!pre.lines.length)return{text:'',crops:[],angle:pre.angle,n:0};
 await loadTess();const mk=async l=>{const w=await Tesseract.createWorker(l,1,{logger:()=>{}});await w.setParameters({tessedit_pageseg_mode:'7',preserve_interword_spaces:'1'});return w;};
 const dual=/eng/.test(lang)&&lang.includes('+');let wm=null,we=null;
 try{wm=await mk(lang);if(dual)we=await mk('eng');
  const text=[],crops=[];
  for(let i=0;i<pre.lines.length;i++){if(cancel&&cancel())break;prog('Reading line '+(i+1)+' of '+pre.lines.length,i/pre.lines.length);
   const cvn=pre.lines[i].canvas,a=await wm.recognize(cvn);let best={text:lineClean(a.data.text),conf:a.data.confidence||0};
   if(we){const b=await we.recognize(cvn);best=pickBest(best,{text:lineClean(b.data.text),conf:b.data.confidence||0});}
   text.push(fixDigits(best.text));crops.push({img:scaled(cvn,560,.55),conf:Math.round(best.conf)});}
  return{text:text.join('\n'),crops,angle:pre.angle,n:pre.lines.length};

const scriptOf=t=>/[\u0B80-\u0BFF]/.test(t)?'ta':/[\u0900-\u097F]/.test(t)?'hi':/[\u0C00-\u0C7F]/.test(t)?'te':/[\u0C80-\u0CFF]/.test(t)?'kn':/[\u0D00-\u0D7F]/.test(t)?'ml':'en';
function nameDiffers(v,n){const names=[v.name,...(v.aka||[])];return!names.some(x=>scriptOf(x)===scriptOf(n)&&simName(x,n)>=.6);}
function addAka(v,n){if(!n||norm(n)===norm(v.name))return false;v.aka=v.aka||[];if(v.aka.some(x=>norm(x)===norm(n)))return false;v.aka.push(n);return true;}
function updateFrom(v,r){let ch=false;if(r.dob&&v.dob!==r.dob){v.dob=r.dob;ch=true;}if(r.byear){v.byear=r.byear;}if(r.mdate&&v.mdate!==r.mdate){v.mdate=r.mdate;if(!v.marital)v.marital='Married';ch=true;}if(r.address&&v.address!==r.address){v.address=r.address;ch=true;}
 if(r.name&&norm(r.name)!==norm(v.name)){addAka(v,v.name);v.aka=(v.aka||[]).filter(x=>norm(x)!==norm(r.name));v.name=r.name;ch=true;}
 if(ch)v.updated=new Date().toISOString();return ch;}
function fillEmpty(v,r){let ch=false;const set=(k,x)=>{if(x&&!v[k]){v[k]=x;ch=true;}};
 set('mobile',r.mobile);set('whatsapp',r.whatsapp&&r.whatsapp!==cleanMobile(v.mobile)?r.whatsapp:'');set('dob',r.dob);set('byear',r.byear);set('address',r.address);
 if(r.mdate&&!v.mdate){v.mdate=r.mdate;ch=true;if(!v.marital)v.marital='Married';}
 if(r.name&&addAka(v,r.name)&&!(r.upd))ch=true;
 if(r.upd&&updateFrom(v,r))ch=true;if(ch)v.updated=new Date().toISOString();return ch;}
A.scSave=()=>{
 const sc=S.scan;let nNew=0,nLink=0,nDon=0,tot=0;const keep=[],byName=new Map();
 sc.rows.forEach(r=>{
  if(!r.inc||r.act==='skip')return;let devId=null;
  if(r.act==='new'){if(!r.name){keep.push(r);return;}
   let v=r.mobile?db.devotees.find(x=>cleanMobile(x.mobile)===r.mobile):null;if(!v&&!r.mobile)v=dev(byName.get(norm(r.name)));

   devId=v.id;}
  else if(r.act.startsWith('link:')){const v=dev(r.act.slice(5));if(!v){keep.push(r);return;}fillEmpty(v,r);devId=v.id;nLink++;}
  if(r.don&&r.amount>0){db.donations.push({id:uid(),devId,name:devId?'':(r.name||'Anonymous'),amount:r.amount,date:r.date||iso(new Date()),purpose:sc.purpose||'Donation',mode:'Cash',rcpt:nextRcpt(),note:r.note||'',src:'scan',by:S.user.username,created:new Date().toISOString()});nDon++;tot+=r.amount;}});
 if(!nNew&&!nLink&&!nDon){toast(keep.length?'Add a name to the highlighted rows first':'Nothing to save');return;}
 sc.rows=keep;if(!keep.length){sc.pages=[];sc.warn=[];sc.hint='';}
 touch('scan import',nNew+' new, '+nLink+' existing, '+nDon+' donations ('+tot+')');
 toast(`Saved: ${nNew} new devotees, ${nLink} existing, ${nDon} donations ${money(tot)}`);
 if(keep.length)render();else go(nDon?'donations':'devotees');};

 rows.forEach(r=>{const m=cleanMobile(r.mobile);if(!m)return;const v=db.devotees.find(d=>cleanMobile(d.mobile)===m||cleanMobile(d.whatsapp)===m);if(!v){unk++;return;}

  if(isOk){if(viaWa)v.waStatus='yes';ok++;}else{if(viaWa)v.waStatus='no';bad++;}
  if(ev){let x=rec;if(!x){x={id:uid(),key,evId:ev.id,devId:v.id,ch:viaWa?'wa':'sms'};db.invites.push(x);}x.st=isOk?'delivered':'failed';x.t=new Date().toISOString();}});

function vConvert(type,text){
 const t=String(text||'').trim();if(!t)return{ok:false,value:'',show:''};
 if(type==='text'){const v=titleCase(t);return{ok:true,value:v,show:v};}
 if(type==='sentence'){const v=t.charAt(0).toUpperCase()+t.slice(1);return{ok:true,value:v,show:v};}
 if(type==='digits'){const d=spokenNums(toAscii(t)).replace(/\D/g,'');let m=d;if(m.length===12&&m.startsWith('91'))m=m.slice(2);if(m.length===11&&m[0]==='0')m=m.slice(1);const ok=/^[6-9]\d{9}$/.test(m);return{ok,value:m,show:m||'—',warn:m&&!ok?m.length+' digits — a mobile number has 10. Say the digits one by one.':''};}
 if(type==='ddmm'){const n=cleanOf(spokenNums(toAscii(t))),ds=okDates(n);if(ds[0]){const v=dd(ds[0].d,ds[0].m);return{ok:true,value:v,show:fk(v)+(ds[0].y?' ('+ds[0].y+')':''),year:ds[0].y?String(ds[0].y):''};}const d=n.replace(/\D/g,'');if(d.length===4&&normDDMM(d))return{ok:true,value:d,show:fk(d)};return{ok:false,value:'',show:'',warn:'Say the day and month, for example “22 July”.'};}
 if(type==='year'){const m=/(19|20)\d{2}/.exec(spokenNums(toAscii(t)));return m?{ok:true,value:m[0],show:m[0]}:{ok:false,value:'',show:'',warn:'Say a four-digit year.'};}
 if(type==='number'){const a=amountOf(t);return a!=null&&!isNaN(a)?{ok:true,value:String(a),show:money(a)}:{ok:false,value:'',show:'',warn:'Say the amount, for example “five hundred”.'};}
 if(type==='devotee'){const p=parseSpoken(t,{});return{ok:!!(p.name||p.mobile),value:p,show:'',warn:'I could not find a name or number.'};}
 return{ok:true,value:t,show:t};}

function bcGeneric(){const lc=db.settings.defLang||'en';let t=(S.bc.tpl&&S.bc.perLang)?((db.settings.tplL[lc]||db.settings.tplL.en)[S.bc.tpl]||S.bc.text):S.bc.text;return tidy(fill(t,{...bcCtx({name:GREET[lc]||'Devotees'},lc),name:GREET[lc]||'Devotees'}).replace(/\n\(.*STOP.*\)/,''));}
function bcQueue(){const people=bcPeople(),sent=new Set((bcRec()||{}).sent||[]),seen=new Set(),items=[],none=[],dup=[];let opt=0;
 people.forEach(v=>{if(v.alerts===false){opt++;return;}const r=routeFor(v);if(r.ch==='none'){none.push(v);return;}const raw=r.ch==='sms'?(v.mobile||v.whatsapp):(v.whatsapp||v.mobile),dest=cleanMobile(raw)||String(raw);if(seen.has(dest)){dup.push(v);return;}seen.add(dest);items.push({v,r,dest,text:bcText(v),done:sent.has(v.id)});});
 return{items,none,dup,opt,total:people.length};}
const bcRec=()=>db.broadcasts.find(x=>x.id===S.bc.sid);
const bcTitle=()=>{const n=S.bc.gids.map(id=>(grp(id)||{}).name).filter(Boolean);return(n.length?n.join(', '):S.bc.all?'All devotees':S.bc.ids.length?S.bc.ids.length+' devotee(s)':'Message')+' · '+fd(iso(new Date()));};

function bcMark(devId){const r=bcRecCreate();if(!r.sent.includes(devId))r.sent.push(devId);r.text=S.bc.text;r.tpl=S.bc.tpl;r.n=bcQueue().items.length;r.t=new Date().toISOString();touch();}

 return`<div class="arow"><div style="min-width:0;flex:1"><b>${esc(v.name)}</b> <span class="mut">${esc(it.dest)}</span><div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:3px">${chip(it.done?'ok':'info',it.done?'✓ sent':'pending')}${chip('info',wa?'WhatsApp':'SMS')}${waChip(v)}</div></div>

 const g=DEV.get().gw||{};
 return`<p class="mut" style="margin:0 0 8px">${esc(L('Sends every message by itself through a gateway you control (for example a Power Automate flow or a WhatsApp Business / SMS service).'))}</p>

/* ---------- composer actions ---------- */
A.bcAll=()=>{S.bc.all=!S.bc.all;render();};A.bcGrp=d=>{const i=S.bc.gids.indexOf(d.id);if(i<0)S.bc.gids.push(d.id);else S.bc.gids.splice(i,1);render();};

function digestText(ds){const o=occasions(2).filter(x=>x.date===ds),bk=db.bookings.filter(b=>b.date===ds&&b.status!=='Cancelled').sort(byTime);const t=[`🔱 ${(db.settings.templeName||'').split(',').slice(-2).join(',').trim()} — ${fd(ds)}`];
 if(o.length)t.push('🎂 '+o.map(x=>x.v.name+(x.type==='anniversary'?' (💐)':'')).join(', '));if(bk.length)t.push('🛕 '+bk.slice(0,12).map(b=>(b.time||'')+' '+b.svcName+' — '+(b.devName||'')).join('\n'));if(typeof devMsg==='function'){const m=devMsg('ta',L('Devotees'),ds);t.push(m.thought);}return t.join('\n');}
function buildOutbox(){const days={},today=new Date(),types=((S.autoCfg||{}).types)||{};
 for(let i=0;i<3;i++){const ds=iso(addDays(today,i)),items=[],bulk=[];
  occasions(2).filter(o=>o.i===i).forEach(o=>{const v=o.v,rt=routeFor(v);if(rt.ch!=='wa')return;const lc=nfLangOf(v);items.push({id:o.type+'|'+v.id+'|'+ds,to:waNum(v.whatsapp||v.mobile),dv:v.id,type:o.type,lang:lc,params:[v.name],text:mkAlert(o.type,v,ds,null).msg,name:v.name});});
  db.bookings.filter(b=>b.status!=='Cancelled'&&b.status!=='Completed'&&b.devId).forEach(b=>{const bd=b.date,send=bd>ds?null:bd===ds?ds:null,prev=iso(addDays(new Date(bd+'T00:00:00'),-1)),key=prev<iso(today)?iso(today):prev;if(key!==ds||bd<iso(today))return;const v=dev(b.devId);if(!v||v.alerts===false||routeFor(v).ch!=='wa')return;const lc=nfLangOf(v);
   items.push({id:'bk|'+b.id+'|'+ds,to:waNum(v.whatsapp||v.mobile),dv:v.id,type:'booking',lang:lc,params:[v.name,b.svcName,fd(b.date),fmtTime(b.time,lc)],text:fill(tplFor('booking',v),{lang:lc,name:v.name,pooja:b.svcName,date:fd(b.date),time:fmtTime(b.time,lc)}),name:v.name});});
  if(typeof devSubscribers==='function'&&types.devotional!==false){const subs=devSubscribers(),byL={};subs.forEach(v=>{if(routeFor(v).ch!=='wa')return;(byL[nfLangOf(v)]=byL[nfLangOf(v)]||[]).push([v.name,waNum(v.whatsapp||v.mobile),v.id]);});
   Object.keys(byL).forEach(lc=>{const m=devMsg(lc,'{name}',ds);bulk.push({id:'dv|'+ds+'|'+lc,type:'devotional',lang:lc,th:m.thought,text:m.text,r:byL[lc]});});}
  days[ds]={items,bulk,digest:digestText(ds),channel:(typeof devMsg==='function')?devMsg('ta',L('Devotees'),ds).channel:''};}
 return days;}

function dayIdx(ds){const d=new Date(ds+'T00:00:00'),y0=new Date(d.getFullYear(),0,0);return Math.floor((d-y0)/864e5);}
function thoughtFor(lc,ds){const d=new Date(ds+'T00:00:00'),ta=lc==='ta',custom=(db.settings.thoughts||[]).filter(x=>x&&(x.ta||x.en)),
 pool=ta?TH_TA.concat(custom.map(x=>x.ta||x.en)):TH_EN.concat(custom.map(x=>x.en||x.ta)),
 i=dayIdx(ds);if(d.getDay()===2&&!(db.settings.devo||{}).noTue)return(ta?TUE_TA:TUE_EN)[Math.floor(i/7)%3];return pool[i%pool.length];}
function devMsg(lc,name,ds){lc=GR_L[lc]?lc:'en';const th=thoughtFor(lc,ds),text='🙏 '+GR_L[lc]+' '+name+'. '+th+' '+CL_L[lc];
 return{text,thought:th,channel:'🙏 '+thoughtFor('ta',ds)+'\n'+thoughtFor('en',ds)+'\n\n'+CL_L.ta+' · '+CL_L.en};}

   rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data);};
   rec.onstop=()=>{clearInterval(tick);dur=(Date.now()-t0)/1000;blob=new Blob(chunks,{type:rec.mimeType||mime||'video/webm'});try{if(url)URL.revokeObjectURL(url);}catch(e){}url=URL.createObjectURL(blob);state='review';stopStream();vid.srcObject=null;vid.src=url;vid.controls=true;vid.muted=false;vid.play().catch(()=>{});draw();};

 addDict([['LIVE NOW','இப்போது நேரலை'],['Starts soon','விரைவில் தொடங்கும்'],['Start now','இப்போது தொடங்கு'],['starting now','இப்போது தொடங்குகிறது'],['in','இன்னும்'],['min','நிமி'],['h','மணி'],['days','நாட்கள்'],['Copy link','இணைப்பை நகலெடு'],['Share link','இணைப்பைப் பகிர்'],['QR code','QR குறியீடு'],['Before you go live','நேரலைக்கு முன்'],['Record or send a video','வீடியோ பதிவு செய் / அனுப்பு'],['Saved videos','சேமித்த வீடியோக்கள்'],['Share QR picture','QR படத்தைப் பகிர்'],['Scan to watch the live','நேரலை பார்க்க ஸ்கேன் செய்க'],['Live starts soon:','நேரலை விரைவில்:'],['Create & share','உருவாக்கு & பகிர்']]);});
/* ---------- status page ---------- */
hook('Status page',['VIEWS','TITLES','MORE','S','db'],()=>{
 TITLES.pxstat='v9.1 status';if(!MORE.some(m=>m[0]==='pxstat'))MORE.push(['pxstat','gear','v9.1 status','a']);
 VIEWS.pxstat=()=>{const c=PX.caps,row=(k,ok,t)=>`<tr><th>${E(k)}</th><td>${ok===null?'':ok?'✅ ':'⚠️ '}${E(t)}</td></tr>`;
  return `<div class="card"><h3>v${E(PX.v)} ${E(tx('add-on'))}</h3><table class="kv">${PX.hooks.map(h=>row(h.name,h.ok,h.ok?tx('active'):h.msg)).join('')}</table></div>
  <div class="card"><h3>${E(tx('This phone'))}</h3><table class="kv">${row('Share files',c.shareFiles,c.shareFiles?'yes':'no — a Save / Share-now sheet is used')}${row('Share video',c.shareVideo,c.shareVideo?'yes':'no')}${row('Camera recorder',c.camera&&c.recorder,c.camera&&c.recorder?(c.mp4rec?'MP4':'WebM'):'not available')}${row('Voice typing',c.speech,c.speech?'yes':'no — use Chrome')}${row('On-device translator',null,c.translator?'available':'not available (online translator is used)')}${row('Online translation used today',null,(PX.mmUsed?PX.mmUsed():0)+' / about 5000 characters')}${row('Gallery cache',null,PX.fmtSize(PX.cacheBytes||0))}</table>
  <label class="chk" style="padding:8px 0"><input type="checkbox" data-pxauto ${DEV.get().autoTa===false?'':'checked'}> ${E(tx('Fill in Tamil automatically while I type English'))}</label><label class="chk" style="padding:8px 0"><input type="checkbox" data-pxdevtr ${DEV.get().devTr===true?'checked':''}> ${E(tx('Use the browser’s built-in translator when it has one (desktop Chrome only)'))}</label></div>
  ${PX.errs.length?`<div class="card"><h3>${E(tx('Problems'))}</h3><pre style="white-space:pre-wrap;font-size:11px;max-height:220px;overflow:auto">${E(PX.errs.slice(-6).join('\n\n'))}</pre></div>`:''}`;};
 document.addEventListener('change',e=>{const t=e.target;if(t&&t.dataset&&'pxauto' in t.dataset){DEV.set({autoTa:t.checked});toast(tx('Saved'));}else if(t&&t.dataset&&'pxdevtr' in t.dataset){DEV.set({devTr:t.checked});toast(tx('Saved'));}});
 addDict([['v9.1 status','v9.1 நிலை'],['add-on','கூடுதல் வசதி'],['This phone','இந்த போன்'],['active','இயங்குகிறது'],['Problems','சிக்கல்கள்'],['Fill in Tamil automatically while I type English','ஆங்கிலம் தட்டச்சு செய்யும்போது தமிழை தானாக நிரப்பு']]);});
})();
